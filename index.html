<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1012">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ритм">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Ритм</title>
<style>
@font-face{font-family:Manrope;font-weight:500 800;font-display:swap;src:url(fonts/manrope-cyr.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Manrope;font-weight:500 800;font-display:swap;src:url(fonts/manrope-lat.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Unbounded;font-weight:600 800;font-display:swap;src:url(fonts/unbounded-cyr.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Unbounded;font-weight:600 800;font-display:swap;src:url(fonts/unbounded-lat.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg:#0f1012; --s1:#191b1e; --s2:#22252a; --ln:#2c3036;
  --tx:#f6f5f0; --mu:#9aa0a6; --fa:#656b72;
  --ac:#ffc23d; --ac2:#ff9f1c; --on:#151515;
  --gr:#5fd68a; --rd:#ff6f5e; --bl:#72b8ff; --vi:#c49bff;
  --r:20px; --r-sm:14px; --nav-h:72px;
  --head:Unbounded,Manrope,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35}
body{min-height:100vh;padding-bottom:calc(var(--nav-h) + 34px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.H{font-family:var(--head)}

/* header */
.top{display:flex;align-items:center;gap:12px;padding:calc(18px + env(safe-area-inset-top)) 16px 10px}
.top .t{flex:1;min-width:0}
.top .hi{font-size:13px;color:var(--mu);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1{font-family:var(--head);font-size:21px;margin:2px 0 0;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--ln);background:var(--s1);display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px;stroke:var(--tx)}

main{padding:4px 16px}
.view{display:none}
.view.on{display:block;animation:fade .18s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

/* hero */
.hero{border-radius:26px;padding:18px;background:radial-gradient(120% 140% at 100% 0%,#ffd76e 0%,var(--ac) 45%,var(--ac2) 100%);color:var(--on);position:relative;overflow:hidden}
.hero .l{font-size:13px;font-weight:800;opacity:.7}
.hero .v{font-family:var(--head);font-size:36px;font-weight:800;margin:4px 0 12px;letter-spacing:-1px;line-height:1.05}
.hero .bar{height:8px;background:rgba(0,0,0,.14);border-radius:6px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:var(--on);border-radius:6px;transition:width .4s}
.hero .meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:800;margin-top:8px}
.hero .deco{position:absolute;right:-12px;top:-8px;opacity:.12;width:150px;height:150px;pointer-events:none}

.mic{margin:12px 0 0;width:100%;display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--ln);border-radius:22px;padding:12px 14px;text-align:left}
.mic .b{width:48px;height:48px;border-radius:16px;background:var(--ac);display:grid;place-items:center;box-shadow:0 0 0 6px rgba(255,194,61,.12);flex:none}
.mic .b svg{width:24px;height:24px;stroke:var(--on)}
.mic b{display:block;font-size:16px}
.mic small{color:var(--fa);font-size:12.5px;font-weight:600}

.st{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:24px 2px 12px}
.st span{font-family:var(--head);font-size:14.5px;font-weight:700}
.st em{font-style:normal;font-size:12.5px;color:var(--mu);font-weight:700;white-space:nowrap}
.link{background:none;border:none;color:var(--ac);font-weight:800;padding:4px 0;font-size:14px}

/* timeline */
.tl{position:relative;padding-left:20px}
.tl:before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--ln);border-radius:2px}
.ev{position:relative;background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;width:100%;text-align:left}
.tl .ev:before{content:"";position:absolute;left:-20px;top:17px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ac)}
.tl .ev.done:before{background:var(--gr);border-color:var(--gr)}
.tl .ev.cancel:before{border-color:var(--fa)}
.ev .tm{font-family:var(--head);font-weight:700;font-size:13.5px;width:56px;flex:none;padding-top:1px}
.ev .tm small{display:block;font-family:Manrope,sans-serif;color:var(--fa);font-size:11.5px;font-weight:700;margin-top:3px}
.ev .bd{flex:1;min-width:0}
.ev .n{font-weight:800;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .s{font-size:13px;color:var(--mu);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ev .r{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.ev .p{font-weight:800;font-size:15px}
.ev.done{opacity:.78}
.ev.cancel{opacity:.45}
.ev.cancel .n{text-decoration:line-through}
.ev .ph-ic{font-size:11px;color:var(--fa);font-weight:800}
.free{position:relative;width:100%;border:1.5px dashed rgba(255,194,61,.45);background:transparent;border-radius:18px;padding:11px 14px;margin-bottom:10px;color:var(--ac);font-weight:800;font-size:13.5px;display:flex;justify-content:space-between;gap:8px;text-align:left}
.tl .free:before{content:"";position:absolute;left:-17px;top:16px;width:8px;height:8px;border-radius:50%;background:var(--ac)}
.list{display:flex;flex-direction:column;gap:10px}
.list .ev{margin-bottom:0}
.empty{color:var(--fa);text-align:center;padding:24px 12px;border:1.5px dashed var(--ln);border-radius:var(--r);font-size:15px;font-weight:600}

.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--s2);color:var(--mu);white-space:nowrap}
.c-new{background:rgba(114,184,255,.15);color:var(--bl)}
.c-confirmed{background:rgba(196,155,255,.16);color:var(--vi)}
.c-done,.c-paid{background:rgba(95,214,138,.15);color:var(--gr)}
.c-cancelled{background:rgba(255,255,255,.07);color:var(--fa)}
.c-debt{background:rgba(255,111,94,.15);color:var(--rd)}

.row-card{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:12px 14px;width:100%;text-align:left}
.row-card .bd{flex:1;min-width:0}
.row-card .n{font-weight:800;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-card .s{font-size:13px;color:var(--mu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-btn{border:1px solid var(--ln);background:var(--s2);border-radius:12px;padding:9px 12px;font-size:13.5px;font-weight:800;white-space:nowrap;flex:none}
.mini-btn.acc{background:var(--ac);color:var(--on);border-color:var(--ac)}
.avatar{width:42px;height:42px;border-radius:14px;background:var(--s2);display:grid;place-items:center;font-weight:800;color:var(--ac);flex:none;font-size:15px}

/* calendar */
.week-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.week-nav .ttl{flex:1;text-align:center;font-weight:800;font-size:15px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.d{border-radius:14px;padding:8px 0 7px;background:var(--s1);border:1px solid var(--ln);text-align:center}
.d small{display:block;font-size:10.5px;color:var(--mu);font-weight:800;text-transform:uppercase}
.d b{font-family:var(--head);font-size:16px;font-weight:700}
.d i{display:block;height:4px;width:20px;margin:5px auto 0;border-radius:3px;background:var(--ln)}
.d.today b{color:var(--ac)}
.d.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.d.on small,.d.on b{color:var(--on)}
.d.on i{background:var(--on)!important}
.load-lo{background:var(--gr)!important}.load-mid{background:var(--ac2)!important}.load-hi{background:var(--rd)!important}
.grid{position:relative;border-left:1px solid var(--ln);margin-left:38px}
.hr{position:absolute;left:-38px;right:0;height:1px;background:rgba(255,255,255,.06);font-size:11px;color:var(--fa);font-weight:800}
.hr span{position:absolute;left:0;top:-8px}
.blk{position:absolute;border-radius:14px;padding:7px 10px;font-size:12.5px;overflow:hidden;text-align:left;border:none;color:var(--tx);line-height:1.25}
.blk b{display:block;font-size:13px}
.blk.st-new{background:rgba(114,184,255,.16);border-left:4px solid var(--bl)}
.blk.st-confirmed{background:rgba(196,155,255,.16);border-left:4px solid var(--vi)}
.blk.st-done{background:rgba(95,214,138,.14);border-left:4px solid var(--gr)}
.blk.st-cancelled{background:rgba(255,255,255,.05);border-left:4px solid var(--fa);opacity:.6}
.blk.fr{background:transparent;border:1.5px dashed rgba(255,194,61,.45);color:var(--ac);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:12.5px}
.now{position:absolute;left:-4px;right:0;height:2px;background:var(--rd);z-index:3;pointer-events:none}
.now:before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--rd)}

/* clients */
.search{width:100%;padding:14px 16px;border-radius:18px;border:1px solid var(--ln);background:var(--s1);font-size:16px;margin-bottom:12px;outline:none}
.search:focus{border-color:var(--ac)}

/* money */
.seg{display:flex;background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:none;background:transparent;padding:10px 4px;border-radius:12px;font-weight:800;color:var(--mu);font-size:14px}
.seg button.on{background:var(--ac);color:var(--on)}
.big{font-family:var(--head);font-size:36px;font-weight:800;letter-spacing:-1px}
.trend{display:inline-block;font-weight:800;font-size:12px;padding:4px 9px;border-radius:999px;margin-left:8px;vertical-align:middle;background:var(--s2);color:var(--mu)}
.trend.up{background:rgba(95,214,138,.15);color:var(--gr)}
.trend.down{background:rgba(255,111,94,.15);color:var(--rd)}
.chart{display:flex;align-items:flex-end;gap:5px;height:130px;margin:16px 0 6px}
.chart div{flex:1;border-radius:7px 7px 3px 3px;background:var(--s2);min-height:3px;position:relative}
.chart div.hl{background:linear-gradient(var(--ac),var(--ac2))}
.chart div.td{outline:2px solid var(--ac);outline-offset:1px}
.lbls{display:flex;gap:5px;font-size:10.5px;color:var(--fa);font-weight:800}
.lbls span{flex:1;text-align:center;white-space:nowrap;overflow:visible}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.kp div{background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:12px 14px}
.kp small{display:block;color:var(--mu);font-size:12px;font-weight:700}
.kp b{font-family:var(--head);font-size:17px;font-weight:700}
.panel{background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:4px 14px}
.topsv .r{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:700;margin:10px 0}
.topsv .r span{flex:0 0 42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topsv .r i{height:8px;border-radius:5px;background:var(--ac);display:block;min-width:4px}
.topsv .r em{font-style:normal;color:var(--mu);margin-left:auto;white-space:nowrap}
.listed{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln)}
.listed:last-child{border-bottom:none}
.listed .grow{flex:1;min-width:0}
.listed .grow small{display:block;color:var(--fa);font-size:13px}
.del{background:none;border:none;color:var(--fa);font-size:22px;padding:0 6px;line-height:1}

/* bottom nav */
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));height:var(--nav-h);border-radius:26px;background:rgba(25,27,30,.94);border:1px solid var(--ln);display:grid;grid-template-columns:1fr 1fr 70px 1fr 1fr;align-items:center;z-index:20;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
nav.tabs button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--fa);padding:8px 0}
nav.tabs button svg{width:23px;height:23px;stroke:currentColor}
nav.tabs button.on{color:var(--ac)}
nav.tabs .fab{width:54px;height:54px;border-radius:19px;background:var(--ac);display:grid;place-items:center;margin:0 auto;box-shadow:0 6px 18px rgba(0,0,0,.4);padding:0}
nav.tabs .fab svg{width:28px;height:28px;stroke:var(--on);stroke-width:2.6}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:93vh;overflow:auto;background:var(--s1);border-radius:26px 26px 0 0;z-index:41;padding:10px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .24s cubic-bezier(.2,.8,.2,1);border-top:1px solid var(--ln);overscroll-behavior:contain}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 12px}
.sheet-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.sheet-head h2{flex:1;margin:0 0 3px;font-family:var(--head);font-size:19px;font-weight:700;letter-spacing:-.2px}
.close-x{width:40px;height:40px;border-radius:13px;border:1px solid var(--ln);background:var(--s2);display:grid;place-items:center;flex:none}
.close-x svg{width:20px;height:20px;stroke:var(--tx)}

/* forms */
.f{margin-bottom:14px}
.f label{display:block;font-size:13px;font-weight:800;color:var(--mu);margin:0 0 6px 2px}
.f input,.f select,.f textarea{width:100%;padding:14px;border-radius:var(--r-sm);border:1px solid var(--ln);background:var(--bg);font-size:16px;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ac)}
.f textarea{min-height:70px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--ln);background:var(--bg);border-radius:999px;padding:9px 14px;font-weight:800;font-size:14px;color:var(--mu)}
.pill.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:18px;border:none;background:var(--ac);color:var(--on);font-weight:800;font-size:16.5px}
.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--ln)}
.btn.danger{background:transparent;color:var(--rd);border:1px solid rgba(255,111,94,.4)}
.btns{display:grid;gap:10px;margin-top:6px}
.btns.two{grid-template-columns:1fr 1fr}
.sugg{border:1px solid var(--ln);border-radius:var(--r-sm);margin-top:6px;overflow:hidden}
.sugg button{display:block;width:100%;text-align:left;border:none;border-bottom:1px solid var(--ln);background:var(--bg);padding:12px 14px;font-weight:700}
.sugg button:last-child{border-bottom:none}
.sugg small{color:var(--fa);margin-left:6px;font-weight:600}
.picked{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--ac);border-radius:var(--r-sm);background:rgba(255,194,61,.07)}
.picked .nm{flex:1;font-weight:800}
.voice-note{background:rgba(255,194,61,.09);border:1px solid rgba(255,194,61,.35);border-radius:var(--r-sm);padding:10px 12px;font-size:14px;margin-bottom:14px}
.voice-note b{color:var(--ac)}
.items{border:1px solid var(--ln);border-radius:var(--r-sm);padding:6px 10px;background:var(--bg)}
.it-row{display:grid;grid-template-columns:1fr 54px 84px 24px;gap:6px;align-items:center;padding:4px 0}
.it-row input{padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--s1);font-size:15px;outline:none;width:100%}
.it-sum{display:flex;justify-content:space-between;font-weight:800;padding:8px 2px 4px;border-top:1px solid var(--ln);margin-top:4px}

/* detail */
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--ln);font-size:15px}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--mu)}
.kv span:last-child{text-align:right;font-weight:700}
.contact-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 14px}
.contact-row button{border:1px solid var(--ln);background:var(--s2);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800}
.contact-row svg{width:22px;height:22px;stroke:var(--ac)}
.contact-row button:disabled{opacity:.35}
.status-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 14px}
.status-row button{padding:12px 6px;border-radius:14px;border:1px solid var(--ln);background:var(--bg);font-weight:800;font-size:14px;color:var(--mu)}
.status-row button.on{border-color:var(--ac);color:var(--ac);background:rgba(255,194,61,.08)}
.paybox{background:var(--bg);border:1px solid var(--ln);border-radius:18px;padding:12px 14px;margin:6px 0 12px}
.paybox .line{display:flex;justify-content:space-between;padding:4px 0}
.paybox .line.tot{border-top:1px solid var(--ln);margin-top:6px;padding-top:10px;font-weight:800;font-size:17px}
.pay-hist{font-size:13px;color:var(--mu);margin-top:6px}
.card{background:var(--bg);border:1px solid var(--ln);border-radius:18px;padding:4px 14px;margin-bottom:12px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 14px}
.photos .ph{aspect-ratio:1;border-radius:14px;background:var(--s2) center/cover no-repeat;border:1px solid var(--ln);position:relative}
.photos .ph .x{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:9px;background:rgba(0,0,0,.6);border:none;color:#fff;font-size:16px;line-height:1}
.photos .add{aspect-ratio:1;border-radius:14px;border:1.5px dashed var(--ln);background:transparent;color:var(--mu);font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.photos .add svg{width:24px;height:24px;stroke:var(--ac)}
.viewer{position:fixed;inset:0;background:#000;z-index:95;display:grid;place-items:center}
.viewer img{max-width:100%;max-height:100%}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--bg);border:1px solid var(--ln);border-radius:18px;padding:12px 14px}
.stat .l{font-size:12.5px;color:var(--mu);font-weight:700}
.stat .v{font-family:var(--head);font-size:19px;font-weight:700;margin-top:3px}
.stat.wide{grid-column:1/-1}
.g{color:var(--gr)}.rr{color:var(--rd)}

/* onboarding */
.onb{position:fixed;inset:0;background:var(--bg);z-index:60;overflow:auto;padding:calc(40px + env(safe-area-inset-top)) 22px 32px}
.onb .logo{width:64px;height:64px;border-radius:20px;background:radial-gradient(120% 140% at 100% 0%,#ffd76e 0%,var(--ac) 45%,var(--ac2) 100%);display:grid;place-items:center;margin-bottom:18px}
.onb .logo svg{width:38px;height:38px}
.onb h1{font-family:var(--head);font-size:34px;margin:0 0 6px;font-weight:800;letter-spacing:-1px}
.onb p.lead{color:var(--mu);font-size:17px;margin:0 0 28px;font-weight:600}
.sphere{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:20px;border:2px solid var(--ln);background:var(--s1);margin-bottom:10px}
.sphere .em{font-size:28px;width:40px;text-align:center}
.sphere b{display:block;font-size:17px}
.sphere small{color:var(--mu);font-size:14px;font-weight:600}
.sphere.on{border-color:var(--ac);background:rgba(255,194,61,.07)}
.check{display:flex;gap:10px;align-items:flex-start;margin:16px 0 22px;color:var(--mu);font-size:15px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--ac);flex:none;margin:0}

/* toast & dialog */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:800;font-size:15px;z-index:99;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.dlg{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.65)}
.dlg .box{background:var(--s1);border:1px solid var(--ln);border-radius:22px;padding:20px;width:100%;max-width:400px}
.dlg .msg{font-size:17px;margin-bottom:18px;white-space:pre-wrap;font-weight:600}
.hint{font-size:13px;color:var(--fa);margin:0 0 6px;font-weight:600}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.sw input{width:22px;height:22px;accent-color:var(--ac)}

/* free windows between timed records within working hours */

  if (d < today()) return [];

var photoCache = {}, idbP = null;

      rq.onsuccess = function () { res(rq.result); };

}

}

var WORDNUM = { "одна": 1, "одну": 1, "першій": 1, "першу": 1, "дві": 2, "другій": 2, "другу": 2, "три": 3, "третій": 3, "чотири": 4, "четвертій": 4, "п'ять": 5, "п'ятій": 5, "пятій": 5, "шість": 6, "шостій": 6, "сім": 7, "сьомій": 7, "вісім": 8, "восьмій": 8, "дев'ять": 9, "дев'ятій": 9, "десять": 10, "десятій": 10, "одинадцять": 11, "одинадцятій": 11, "дванадцять": 12, "дванадцятій": 12, "тринадцятій": 13, "чотирнадцятій": 14, "п'ятнадцятій": 15, "шістнадцятій": 16, "сімнадцятій": 17, "вісімнадцятій": 18, "дев'ятнадцятій": 19, "двадцятій": 20 };

function escRe(x) { return x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function parseVoice(text) {
  var out = { text: text }, t = today(), m;
  var s = " " + String(text).replace(/[’`ʼ]/g, "'").replace(/\s+/g, " ") + " ";
  var low = s.toLowerCase();
  function rm(piece, at) {
    if (!piece) return;
    var i = typeof at === "number" ? at : low.indexOf(piece.toLowerCase());
    if (i < 0) return;
    var fillS = "," + new Array(piece.length).join(" ");
    s = s.slice(0, i) + fillS + s.slice(i + piece.length);
    low = low.slice(0, i) + fillS + low.slice(i + piece.length);
  }
  var B = "(?:^|[\\s,.])", E = "(?=[\\s,.!?]|$)";
  if ((m = low.match(new RegExp(B + "(післязавтра)" + E)))) { out.date = addDays(t, 2); rm(m[1]); }
  else if ((m = low.match(new RegExp(B + "(завтра)" + E)))) { out.date = addDays(t, 1); rm(m[1]); }
  else if ((m = low.match(new RegExp(B + "(сьогодні)" + E)))) { out.date = t; rm(m[1]); }
  if (!out.date && (m = low.match(/(?:на\s+)?(\d{1,2})\s+(січня|лютого|березня|квітня|травня|червня|липня|серпня|вересня|жовтня|листопада|грудня)/))) {
    var mi = MON_G.indexOf(m[2]), yr = new Date().getFullYear(), d = new Date(yr, mi, +m[1]);
    if (iso(d) < t) d = new Date(yr + 1, mi, +m[1]);
    out.date = iso(d); rm(m[0]);

  D.recs.forEach(function (x) {

    var r = { id: uid(), created: t, clientId: c.id, service: s.name, date: addDays(t, x[2]), time: x[3], dur: s.dur || 60, address: c.address, price: x[6], materials: x[7], note: "", status: x[4], photos: [], items: [] };
    state.records.push(r);
    if (x[5] === 1) addPayment(r, x[6], "payment", r.date);
    else if (x[5] > 1) addPayment(r, x[5], "deposit", addDays(t, -1));
  });
  if (sp === "repair") state.expenses.push({ id: uid(), amount: 450, note: "Пальне", date: t });
  else state.expenses.push({ id: uid(), amount: 1200, note: "Гель-лаки", date: addDays(t, -3) });
}

/* ===================== events ===================== */
document.addEventListener("click", function (e) {
  var b;
  if ((b = e.target.closest("nav.tabs [data-tab]"))) { setTab(b.dataset.tab); return; }
  if (e.target.closest(".sheet") || e.target.closest(".dlg") || e.target.closest(".onb") || e.target.closest(".viewer")) return;
  if ((b = e.target.closest("[data-rec]"))) { recordSheet(b.dataset.rec); return; }
  if ((b = e.target.closest("[data-free]"))) { var fp = b.dataset.free.split("|"); recordForm({ date: fp[0], time: fp[1] }); return; }
  if ((b = e.target.closest("[data-remind]"))) { var r = record(b.dataset.remind), c = r && client(r.clientId); if (c) messageSheet(c, fill(state.templates.remind, r, c), "Нагадування", function () { r.reminded = true; save(); refresh(); }); return; }
  if ((b = e.target.closest("[data-again]"))) { var ca = client(b.dataset.again); if (ca) messageSheet(ca, fill(state.templates.again, null, ca), "Запросити знову", function () { ca.againSent = today(); save(); refresh(); }); return; }
  if ((b = e.target.closest("[data-client]"))) { clientSheet(b.dataset.client); return; }
  if ((b = e.target.closest("[data-day]"))) { calSel = b.dataset.day; renderCal(); return; }
  if ((b = e.target.closest("[data-wk]"))) { calSel = addDays(calSel, +b.dataset.wk); renderCal(); return; }
  if ((b = e.target.closest("[data-goto]"))) { setTab(b.dataset.goto); return; }
  if ((b = e.target.closest("[data-p]"))) { period = b.dataset.p; periodOff = 0; renderMoney(); return; }
  if ((b = e.target.closest("[data-po]"))) { periodOff += +b.dataset.po; renderMoney(); return; }
  if ((b = e.target.closest("[data-delexp]"))) { var id = b.dataset.delexp; confirmDlg("Видалити витрату?", "Видалити", true).then(function (ok) { if (ok) { state.expenses = state.expenses.filter(function (x) { return x.id !== id; }); save(); refresh(); } }); return; }
  if (e.target.closest("#voiceBtn")) { startVoice(); return; }
  if (e.target.closest("#instClose")) { try { localStorage.setItem("rytm-inst-hint", "1"); } catch (x) {} renderToday(); return; }
  if (e.target.closest("#addClientBtn")) { clientForm(null); return; }
  if (e.target.closest("#addExpBtn")) { expenseForm(); return; }
});
document.addEventListener("input", function (e) { if (e.target.id === "clientSearch") { clientQ = e.target.value; renderClientList(); } });
$("#fab").addEventListener("click", function () { recordForm({ date: curTab === "cal" && calSel ? calSel : today() }); });
$("#settingsBtn").addEventListener("click", settingsSheet);
document.addEventListener("visibilitychange", function () { if (!document.hidden && !sheetStack.length) refresh(); });
setInterval(function () { if (!document.hidden && !sheetStack.length && (curTab === "today" || curTab === "cal")) refresh(); }, 60000);

/* ===================== boot ===================== */
function installHintClosed() { try { return localStorage.getItem("rytm-inst-hint") === "1"; } catch (e) { return true; } }
state = load();
render();
if (!state.profile.sphere) onboarding();
else syncNative();
if (!native) {
  loadPhotoCache().then(function () { if (!sheetStack.length) render(); });
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function () {});
}
window.rytmStartVoice = function () { if (state.profile.sphere) startVoice(); };
</script>
</body>
